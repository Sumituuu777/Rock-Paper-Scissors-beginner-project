<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main"><h1>Rock paper scissors</h1></div>
    <div class="summary"><h3 class="sry"></h3></div>
    <div class="next"><p>choose your option</p></div>
    <div class="btns">
        <button class="btn rock-btn" onclick="game(0)">Rock</button>
        <button class="btn paper-btn" onclick="game(1)">Paper</button>
        <button class="btn scissor-btn" onclick="game(2)">Scissor</button>
        <button class="btn reset" onclick="reset()">Reset</button>
    </div>
    <h2 class="line"></h2>
    <script src="script.js"></script>
</body>
</html>
